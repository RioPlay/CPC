name: CPC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regression suite
        run: python tests/test_cpc.py
      - name: Receiver security regressions
        run: python tests/test_security.py
      - name: Streaming and failure recovery regressions
        run: python tests/test_streaming.py
      - name: Export and multipart regressions
        run: python tests/test_export.py
      - name: Self-contained transfer and cold restore regressions
        run: python tests/test_transfer.py
      - name: Validated named handoff regressions
        run: python tests/test_handoff.py
      - name: Timestamp preservation and policy regressions
        run: python tests/test_timestamps.py
      - name: Explicit recovery and shared safety regressions
        run: python tests/test_recovery.py
      - name: Basic transport and stateless round trips
        run: python tests/test_basic.py
      - name: Payload-first headers and integrity warnings
        run: python tests/test_headers.py
      - name: Release content verification regressions
        run: python tests/test_build_capsule.py
      - name: CLI smoke test
        run: python bin/cpc.py --version
      - name: Verify bundled capsules
        run: |
          python bin/cpc.py v standard/test-vector.cpc.md
          python bin/cpc.py v demo_project.cpc.md
          python bin/cpc.py v CPC.cpc.md
      - name: Check release file allowlist and source bytes
        run: python tools/build_capsule.py --check
